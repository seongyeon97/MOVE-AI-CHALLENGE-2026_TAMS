<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>S&amp;E Driving</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="device-frame">
  <div class="app-root" id="app-root">

    <!-- ===================== AUTH: LOGIN ===================== -->
    <section class="screen screen-auth active" id="screen-login">
      <div class="auth-scroll">
        <div class="auth-brand">
          <img class="brand-logo" data-light-src="../reference/light_logo_trim.png" data-dark-src="../reference/dark_logo_trim.png" alt="S&amp;E Driving" />
        </div>
        <p class="auth-tagline">화물차 안전운전, S&amp;E Driving과 함께 시작하세요</p>

        <form class="auth-card" id="form-login">
          <h2 class="auth-card-title">로그인</h2>
          <div class="field">
            <label for="login-id">아이디</label>
            <input type="text" id="login-id" placeholder="아이디를 입력하세요" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="login-pw">비밀번호</label>
            <div class="input-with-icon">
              <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required />
              <button type="button" class="icon-toggle" data-toggle-pw="login-pw" aria-label="비밀번호 표시"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">로그인</button>
          <p class="auth-switch">계정이 없으신가요? <a href="#" id="link-to-signup">회원가입</a></p>
        </form>
        <p class="auth-demo-note">데모 버전 로그인 정보<br/>ID : glovis / PW : 1234</p>
      </div>
    </section>

    <!-- ===================== AUTH: SIGNUP ===================== -->
    <section class="screen screen-auth" id="screen-signup">
      <button type="button" class="auth-back-btn" id="signup-back-btn" aria-label="뒤로가기"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg></button>
      <div class="auth-scroll">
        <div class="auth-brand">
          <img class="brand-logo" data-light-src="../reference/light_logo_trim.png" data-dark-src="../reference/dark_logo_trim.png" alt="S&amp;E Driving" />
        </div>
        <p class="auth-tagline">화물차 안전운전, S&amp;E Driving과 함께 시작하세요</p>

        <form id="form-signup">
          <div class="auth-card">
            <h2 class="auth-card-title"><span class="step-badge">①</span> 계정 정보</h2>

            <div class="field">
              <label for="su-nickname">닉네임</label>
              <input type="text" id="su-nickname" placeholder="홈 화면에 표시될 이름" required />
            </div>

            <div class="field">
              <label for="su-id">아이디</label>
              <input type="text" id="su-id" placeholder="4자 이상" minlength="4" required />
              <p class="field-hint" id="hint-id">4자 이상 입력해 주세요.</p>
            </div>

            <div class="field">
              <label for="su-pw">비밀번호</label>
              <div class="input-with-icon">
                <input type="password" id="su-pw" placeholder="8자 이상" minlength="8" required />
                <button type="button" class="icon-toggle" data-toggle-pw="su-pw" aria-label="비밀번호 표시"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
              </div>
              <p class="field-hint">8자 이상을 권장합니다.</p>
            </div>

            <div class="field">
              <label for="su-pw2">비밀번호 확인</label>
              <div class="input-with-icon">
                <input type="password" id="su-pw2" placeholder="비밀번호를 다시 입력하세요" minlength="8" required />
                <button type="button" class="icon-toggle" data-toggle-pw="su-pw2" aria-label="비밀번호 표시"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
              </div>
              <p class="field-hint" id="hint-pw2">&nbsp;</p>
            </div>
          </div>

          <div class="auth-card">
            <h2 class="auth-card-title"><span class="step-badge">②</span> 차량 등록</h2>

            <div class="field">
              <label>차량등록증 사진</label>
              <label class="dropzone" for="su-reg-photo" id="reg-dropzone">
                <span class="dropzone-icon"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="17" rx="2.2"/><circle cx="8.5" cy="9" r="1.6"/><path d="M21 15.5l-5.3-5.3L4.5 20.5"/></svg></span>
                <span class="dropzone-title">탭하여 차량등록증 사진 선택</span>
                <span class="dropzone-sub" id="reg-photo-name">선택된 파일 없음</span>
              </label>
              <input type="file" id="su-reg-photo" accept="image/*" capture="environment" style="display:none;" />
              <p class="field-hint" id="reg-parse-hint">사진을 첨부하면 차량번호·차대번호·주행거리·최종점검일을 자동으로 채워드려요.</p>
              <div id="reg-parse-status" style="display:none;"></div>
              <button type="button" class="manual-fallback-btn" id="reg-manual-toggle">사진 없이 직접 입력할게요</button>
            </div>

            <div id="reg-fields" style="display:none;width:100%;margin-bottom:16px;">
              <div class="field">
                <label for="su-plate">차량 번호</label>
                <input type="text" id="su-plate" placeholder="예: 서울 80바 1234" required />
              </div>

              <div class="field">
                <label for="su-vin">차대번호 (VIN)</label>
                <input type="text" id="su-vin" placeholder="자동 인식되거나 직접 입력하세요" />
              </div>

              <div class="field">
                <label for="su-reg-mileage">주행거리 (등록증 기준, km)</label>
                <input type="number" id="su-reg-mileage" placeholder="자동 인식되거나 직접 입력하세요" />
              </div>

              <div class="field">
                <label for="su-last-inspection">최종 점검일</label>
                <input type="date" id="su-last-inspection" />
              </div>
            </div>

            <div class="field">
              <label for="su-type">차종</label>
              <select id="su-type">
                <option value="6" selected>6휠 화물차</option>
                <option value="8">8휠 화물차</option>
              </select>
            </div>

            <div class="field">
              <label for="su-mileage">현재 누적 주행거리 (km)</label>
              <input type="text" inputmode="none" id="su-mileage" class="keypad-tap-input" placeholder="탭하여 입력" data-numeric-keypad readonly required />
            </div>
          </div>

          <label class="privacy-consent-row" for="su-privacy-consent">
            <input type="checkbox" id="su-privacy-consent" required />
            <span>개인정보 수집 및 이용에 동의합니다. (필수)</span>
          </label>

          <button type="submit" class="btn btn-primary btn-block" id="signup-submit-btn" disabled>가입 완료</button>
          <p class="auth-switch">이미 계정이 있으신가요? <a href="#" id="link-to-login">로그인</a></p>
        </form>
      </div>
    </section>

    <!-- ===================== MAIN APP SHELL ===================== -->
    <div class="screen screen-main" id="screen-main">
      <header class="app-header" id="app-header"></header>
      <main class="app-content" id="app-content"></main>
      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item" data-nav="home">
          <span class="nav-icon" data-icon="home"></span>
          <span class="nav-label">홈</span>
        </button>
        <button class="nav-item" data-nav="drive">
          <span class="nav-icon" data-icon="compass"></span>
          <span class="nav-label">운행</span>
        </button>
        <button class="nav-item" data-nav="dashboard">
          <span class="nav-icon" data-icon="wrench"></span>
          <span class="nav-label">정비</span>
        </button>
        <button class="nav-item" data-nav="notifications">
          <span class="nav-icon" data-icon="bell"></span>
          <span class="nav-label">알림</span>
        </button>
        <button class="nav-item" data-nav="settings">
          <span class="nav-icon" data-icon="settings"></span>
          <span class="nav-label">설정</span>
        </button>
      </nav>

      <!-- 공지사항 팝업 -->
      <div class="modal-overlay" id="notice-modal">
        <div class="modal-card">
          <div class="modal-icon-badge">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 3.6 1.8 19.5a1 1 0 0 0 .9 1.5h18.6a1 1 0 0 0 .9-1.5L12.9 3.6a1 1 0 0 0-1.8 0Z"/><path d="M12 9.5v4.2"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></svg>
          </div>
          <div class="modal-notice-tag">[공지사항]</div>
          <div class="modal-heading-row">
            <div class="modal-notice-date" id="notice-modal-date"></div>
            <h3 class="modal-title" id="notice-modal-title">공지사항</h3>
          </div>
          <p class="modal-body" id="notice-modal-body"></p>
          <label class="modal-check" id="notice-check-row">
            <input type="checkbox" id="notice-dont-show" />
            <span>오늘 하루 다시 보지 않기</span>
          </label>
          <button type="button" class="btn btn-primary btn-block" id="notice-confirm">확인하기</button>
        </div>
      </div>

    </div>

    <!-- 숫자 키패드 (바텀시트) — 회원가입/메인 어느 화면에서든 뜰 수 있어 app-root 최상위에 둠 -->
    <div class="keypad-overlay" id="keypad-overlay">
      <div class="keypad-sheet">
        <div class="keypad-header">
          <span class="keypad-label" id="keypad-label">입력</span>
          <span class="keypad-value" id="keypad-value">0</span>
        </div>
        <div class="keypad-grid">
          <button type="button" class="keypad-key" data-key="1">1</button>
          <button type="button" class="keypad-key" data-key="2">2</button>
          <button type="button" class="keypad-key" data-key="3">3</button>
          <button type="button" class="keypad-key" data-key="4">4</button>
          <button type="button" class="keypad-key" data-key="5">5</button>
          <button type="button" class="keypad-key" data-key="6">6</button>
          <button type="button" class="keypad-key" data-key="7">7</button>
          <button type="button" class="keypad-key" data-key="8">8</button>
          <button type="button" class="keypad-key" data-key="9">9</button>
          <button type="button" class="keypad-key keypad-back" data-key="clear">지우기</button>
          <button type="button" class="keypad-key" data-key="0">0</button>
          <button type="button" class="keypad-key keypad-back" data-key="back">⌫</button>
        </div>
        <button type="button" class="btn btn-primary btn-block" id="keypad-done">완료</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 회사뷰(S&E Driving Platform) 공지 연동. app.js보다 먼저 실어야 window.SENotices가 잡힌다. -->
<script src="/se-notice-bridge.js"></script>
<script src="js/config.js" onerror="window.SE_CONFIG = window.SE_CONFIG || {};"></script>
<script type="module" src="js/truck3d.js?v=4"></script>
<script src="js/weather.js"></script>
<script src="js/ocr.js"></script>
<script src="js/kakaoMap.js"></script>
<script src="js/app.js"></script>
</body>
</html>
